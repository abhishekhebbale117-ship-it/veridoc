<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VeriDoc - Register</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #1f2937;
            min-height: 100vh;
            overflow-x: hidden;
        }


        /* ---------------- HEADER ---------------- */

        header {
            background: #123c69;
            color: white;
            padding: 20px 8%;

            animation: headerDrop 0.7s ease-out;
        }

        header h1 {
            font-size: 28px;
            letter-spacing: 0.5px;
        }


        /* ---------------- CONTAINER ---------------- */

        .container {
            max-width: 480px;
            margin: 60px auto;
            padding: 20px;

            animation: fadeUp 0.9s ease-out;
        }


        /* ---------------- CARD ---------------- */

        .card {
            background: white;
            padding: 42px;
            border-radius: 18px;

            box-shadow:
                0 10px 35px rgba(0, 0, 0, 0.08);

            transition:
                transform 0.35s ease,
                box-shadow 0.35s ease;

            animation: cardAppear 0.9s ease-out 0.15s both;
        }

        .card:hover {
            transform: translateY(-5px);

            box-shadow:
                0 18px 45px rgba(0, 0, 0, 0.12);
        }


        /* ---------------- HEADING ---------------- */

        h2 {
            color: #123c69;
            margin-bottom: 10px;
            text-align: center;
            font-size: 28px;

            animation: fadeUp 0.8s ease-out 0.25s both;
        }

        .subtitle {
            text-align: center;
            color: #667085;
            margin-bottom: 30px;
            line-height: 1.6;

            animation: fadeUp 0.8s ease-out 0.35s both;
        }


        /* ---------------- FORM ---------------- */

        .field {
            margin-bottom: 20px;

            animation: fadeUp 0.7s ease-out both;
        }

        .field:nth-child(1) {
            animation-delay: 0.4s;
        }

        .field:nth-child(2) {
            animation-delay: 0.5s;
        }

        .field:nth-child(3) {
            animation-delay: 0.6s;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #344054;
        }

        input {
            width: 100%;
            padding: 14px;

            border: 1px solid #d0d5dd;
            border-radius: 9px;

            font-size: 15px;
            background: white;

            transition:
                border-color 0.25s ease,
                box-shadow 0.25s ease,
                transform 0.2s ease;
        }

        input:hover {
            border-color: #98a2b3;
        }

        input:focus {
            outline: none;

            border-color: #123c69;

            box-shadow:
                0 0 0 4px rgba(18, 60, 105, 0.10);

            transform: translateY(-1px);
        }


        /* ---------------- BUTTON ---------------- */

        button {
            width: 100%;
            padding: 15px;

            border: none;
            border-radius: 9px;

            background: #123c69;
            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;

            position: relative;
            overflow: hidden;

            transition:
                transform 0.2s ease,
                background 0.25s ease,
                box-shadow 0.25s ease;

            animation: fadeUp 0.8s ease-out 0.7s both;
        }

        button::after {
            content: "";

            position: absolute;

            top: 0;
            left: -100%;

            width: 100%;
            height: 100%;

            background: rgba(255, 255, 255, 0.12);

            transition: left 0.35s ease;
        }

        button:hover {
            background: #0d2f52;

            transform: translateY(-3px);

            box-shadow:
                0 8px 20px rgba(18, 60, 105, 0.25);
        }

        button:hover::after {
            left: 100%;
        }

        button:active {
            transform: scale(0.97);
        }


        /* ---------------- ERROR ---------------- */

        .error {
            background: #fff0f0;
            color: #b42318;

            padding: 13px;
            border-radius: 9px;

            margin-bottom: 20px;

            animation: shake 0.4s ease;
        }


        /* ---------------- LOGIN LINK ---------------- */

        .login {
            text-align: center;

            margin-top: 27px;

            color: #667085;

            animation: fadeIn 0.8s ease-out 0.85s both;
        }

        .login a {
            color: #123c69;

            font-weight: bold;

            text-decoration: none;

            position: relative;

            transition: color 0.25s ease;
        }

        .login a::after {
            content: "";

            position: absolute;

            left: 0;
            bottom: -3px;

            width: 0;
            height: 2px;

            background: #123c69;

            transition: width 0.25s ease;
        }

        .login a:hover {
            color: #0d2f52;
        }

        .login a:hover::after {
            width: 100%;
        }


        /* ---------------- ANIMATIONS ---------------- */

        @keyframes fadeUp {

            from {
                opacity: 0;
                transform: translateY(25px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }

        @keyframes cardAppear {

            from {
                opacity: 0;
                transform: translateY(35px) scale(0.97);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }

        }

        @keyframes headerDrop {

            from {
                opacity: 0;
                transform: translateY(-20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }

        @keyframes fadeIn {

            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }

        }

        @keyframes shake {

            0% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-5px);
            }

            50% {
                transform: translateX(5px);
            }

            75% {
                transform: translateX(-3px);
            }

            100% {
                transform: translateX(0);
            }

        }


        /* ---------------- MOBILE ---------------- */

        @media (max-width: 600px) {

            header {
                padding: 18px 6%;
            }

            header h1 {
                font-size: 25px;
            }

            .container {
                margin: 45px auto;
                padding: 18px;
            }

            .card {
                padding: 30px 22px;
            }

            h2 {
                font-size: 25px;
            }

        }

    </style>

</head>


<body>


<header>

    <h1>
        VeriDoc
    </h1>

</header>


<div class="container">


    <div class="card">


        <h2>
            Create Account
        </h2>


        <p class="subtitle">
            Register to verify your admission documents
        </p>


        {% if error %}

        <div class="error">
            {{ error }}
        </div>

        {% endif %}


        <form method="POST">


            <div class="field">

                <label>
                    Full Name
                </label>

                <input
                    type="text"
                    name="name"
                    placeholder="Enter your full name"
                    required
                >

            </div>


            <div class="field">

                <label>
                    Email
                </label>

                <input
                    type="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="field">

                <label>
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    placeholder="Create a password"
                    required
                >

            </div>


            <button type="submit">
                Create Account
            </button>


        </form>


        <div class="login">

            Already have an account?

            <a href="/login">
                Login
            </a>

        </div>


    </div>


</div>


</body>

</html>
